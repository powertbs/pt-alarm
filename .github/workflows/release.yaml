name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach zip to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/pt_alarm/manifest.json > m.json
          mv m.json custom_components/pt_alarm/manifest.json
      - name: Zip
        run: cd custom_components/pt_alarm && zip -r ../../pt_alarm.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: pt_alarm.zip
