arm:
  target:
    entity:
      integration: pt_alarm
      domain: alarm_control_panel
  fields:
    mode:
      required: true
      example: away
      selector:
        select:
          translation_key: arm_mode_short
          options:
            - away
            - stay
            - home
            - night
            - vacation
            - custom_bypass
    code:
      required: false
      selector:
        text:
          type: password
    force:
      required: false
      default: false
      selector:
        boolean:
    skip_delay:
      required: false
      default: false
      selector:
        boolean:
    user:
      required: false
      example: "{{ trigger.event.data.actor }}"
      selector:
        text:
    source:
      required: false
      example: UniFi Access - Front door
      selector:
        text:

disarm:
  target:
    entity:
      integration: pt_alarm
      domain: alarm_control_panel
  fields:
    code:
      required: false
      selector:
        text:
          type: password
    user:
      required: false
      example: "{{ trigger.event.data.actor }}"
      selector:
        text:
    source:
      required: false
      example: UniFi Access - Front door
      selector:
        text:
